name: .NET

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2
          
    - name: Install WiX Toolset
      run: |
        choco install wixtoolset --version=3.14.1.20250415 --force -y --no-progress
        if (!(Test-Path 'C:\Program Files (x86)\MSBuild\Microsoft\WiX\v3.x\Wix.targets')) { throw 'WiX MSBuild targets were not installed.' }
        echo "WixTargetsPath=C:\Program Files (x86)\MSBuild\Microsoft\WiX\v3.x\Wix.targets" >> $env:GITHUB_ENV
        echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

    - name: Install .NET Framework 4.6.1 Developer Pack
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'NDP461-DevPack-KB3105179-ENU.exe'
        Invoke-WebRequest 'https://download.microsoft.com/download/f/1/d/f1deb8db-d277-4ef9-9f48-3a65d4d8f965/NDP461-DevPack-KB3105179-ENU.exe' -OutFile $installer
        $process = Start-Process -FilePath $installer -ArgumentList '/q', '/norestart' -Wait -PassThru
        if ($process.ExitCode -notin @(0, 3010)) { throw ".NET Framework 4.6.1 Developer Pack installation failed with exit code $($process.ExitCode)." }
        if (!(Test-Path 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.1')) { throw '.NET Framework 4.6.1 targeting pack was not installed.' }

    - name: Setup MSBuild Path
      uses: microsoft/setup-msbuild@v1.0.2
      
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1.0.5
      
    - name: Restore NuGet Packages
      run: dotnet restore src\RagnaCustoms.sln
         
    - name: Restore msbuild
      run: msbuild src\RagnaCustoms.sln /t:restore

    - name: Build Solution
      run: msbuild /nologo src\RagnaCustoms.sln /p:Configuration=Release /p:Platform="Any CPU"
      
    - name: Zip RagnaCustoms.App
      uses: vimtor/action-zip@v1
      with:
        files: src\RagnaCustoms.App\bin\Release
        dest:  RagnaCustoms.zip

    - name: Read application version
      if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
      id: version
      shell: pwsh
      run: |
        $versionLine = Select-String -Path 'src/SharedAssemblyInfo.cs' -Pattern 'AssemblyFileVersion\("([^"]+)"\)'
        if (!$versionLine) { throw 'Unable to determine the application version.' }
        $version = $versionLine.Matches[0].Groups[1].Value
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Publish stable release
      if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        $tag = "v$env:VERSION"
        $title = "RagnaCustoms $env:VERSION"
        $zip = 'RagnaCustoms.zip'
        $msi = 'src/RagnaCustoms.Installer2/bin/Release/RagnaCustoms.Installer2.msi'

        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag $zip $msi --clobber
          gh release edit $tag --title $title
        } else {
          gh release create $tag $zip $msi --title $title --generate-notes
        }

    - name: Publish pre-release
      if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') }}
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: pre-release
        prerelease: true
        title: "Development Build"
        files: |
          src/RagnaCustoms.Installer2/bin/Release/RagnaCustoms.Installer2.msi
          RagnaCustoms.zip
